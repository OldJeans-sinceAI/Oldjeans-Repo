name: Backend Yext Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Yext Backend Test
        env:
          YEXT_BASE_URL: ${{ secrets.YEXT_BASE_URL }}
          YEXT_API_KEY: ${{ secrets.YEXT_API_KEY }}
          YEXT_ENTITY_ID: ${{ secrets.YEXT_ENTITY_ID }}
          YEXT_API_VERSION: ${{ secrets.YEXT_API_VERSION }}
        run: npm run test:yext